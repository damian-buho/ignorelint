            severity: error
          - id: IG-006
            title: "Malformed brackets"
            autofix: false
            severity: error
          - id: IG-007
            title: "Space in pattern"
            autofix: false
            severity: warn
          - id: IG-008
            title: "Duplicate rule"
            autofix: true
            severity: warn
          - id: IG-009
            title: "Invalid doublestar"
            autofix: false
            severity: warn
          - id: IG-010
            title: "Rooted shallow pattern"
            autofix: false
            severity: info
          - id: IG-011
            title: "Negated rooted pattern"
            autofix: false
            retired: true
          - id: IG-012
            title: "Redundant pair"
            autofix: false
