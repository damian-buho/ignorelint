name: Ignorelint
# Dogfood: lint this repo with the checked-out action (uses: ./).

# Hand-written file; the pf-ci workflows beside it are generated.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ignorelint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ignorelint:
    name: Ignorelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/
        with:
          recursive: true
          comment: ${{ github.event_name == 'pull_request' }}
