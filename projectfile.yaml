org:
  projectfile:
    artifacts:
      # Stated literally, overriding the crystal.yaml fragment's
      # dist/${identity.name}: ci-resolver reads artifacts.path straight off the
      # merged document for the forgejo-release `release-asset-path:` input and
      # never runs it through interpolateRefs, so the reference would reach the
      # workflow verbatim. Drop this once that resolver fix is released.
      crystal-binary:
        path: dist/ignorelint
    # The binary release plane, tag-gated, mirroring the Go apps. The compile
    # itself comes from the crystal.yaml fragment (crystal-build on `built`, which
    # uploads dist/); this only adds the two release leaves that attach the built
    # asset to a forge, so nothing is compiled twice.
    ci:
      # ONE target, declared rather than guessed. Crystal has no usable
      # cross-compile (`--cross-compile` emits an object file that still needs a
      # linker on the target) and kiota's runners are amd64-only, so a second arch
      # would mean LLVM codegen under QEMU. Declaring the pair also pins the asset
      # name instead of leaving crystal-build to read `uname` on whatever ran it.
      env:
        TARGET_ARCH: amd64
        TARGET_OS: linux
      forgejo:
        credentials:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      gha:
        credentials:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      nodes:
        binaries-released:
          needs:
            built: true
            forgejo-release: true
            gh-release: true
          when:
            events:
              - tag
        published:
          needs:
            binaries-released: true
      tools:
        forgejo-release:
          action: forgejo-release
          env:
            - FORGEJO_TOKEN
          gha: false
          m6e: false
          tags: [publish]
        gh-release:
          env:
            - GH_TOKEN
          forgejo: false
          m6e: false
          run: .scripts/gh-release.sh "$${{ github.ref_name }}"
          description: Upload the built binary to a GitHub release
          tags: [publish]
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    status: maintained
