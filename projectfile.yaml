    url: https://codeberg.org/damian-buho/ignorelint
  - label:
      en: Issues on Codeberg
      es: Incidencias en Codeberg
      uk: Задачі на Codeberg
    priority: 90
    tags:
      - support
    type: bugs
    url: https://codeberg.org/damian-buho/ignorelint/issues
  - derived: true
    label:
      en: Packages on GHCR
      es: Paquetes en GHCR
      uk: Пакунки на GHCR
    type: package-registry
    url: https://github.com/damian-buho/ignorelint/pkgs/container/ignorelint
org:
  projectfile:
    architecture:
      - amd64
      - arm64
    ci:
      env:
        TARGET_ARCH: amd64
        TARGET_OS: linux
      nodes:
        binaries-are-built:
          matrix:
            axes:
              TARGET_ARCH:
                - amd64
                - arm64
              TARGET_OS:
                - linux
        binaries-are-released:
          matrix:
            axes:
              TARGET_ARCH:
                - amd64
                - arm64
              TARGET_OS:
                - linux
    image:
      org: damian-buho
      flatpath: ${name}
    forge:
      # The account IS the org, so the GitHub repository is the bare name
      org: damian-buho
      flatpath: ${name}
    # The org is the GHCR account, so the artifact drops the repeat; foreign pulls keep nesting
    sinks:
      ghcr:
        selfref: ghcr.io/damian-buho/${name}:${tag}
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    operating-system:
      - linux
    status: maintained
  ignorelint: {}
repositories:
  - role: mirror
    type: git
    url: git@github.com:damian-buho/ignorelint.git
  - branch: main
    role: origin
    type: git
    url: ssh://git@kiota.ch/damian-buho/ignorelint.git
  - role: mirror
    type: git
    url: git@codeberg.org:damian-buho/ignorelint.git
technologies:
  - crystal
requirements:
  runtime:
    crystal: '>= 1.13.0'
