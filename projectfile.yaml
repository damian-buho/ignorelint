      uk: Задачі на GitHub
    priority: 80
    tags:
      - support
    type: bugs
    url: https://github.com/damian-buho/ignorelint/issues
  - label:
      en: Ignorelint on kiota.ch
      es: Ignorelint en kiota.ch
      uk: Ignorelint на kiota.ch
    preferred: true
    priority: 10
    type: source-code
    url: https://kiota.ch/damian-buho/ignorelint
  - label:
      en: Ignorelint on Codeberg
      es: Ignorelint en Codeberg
      uk: Ignorelint на Codeberg
    priority: 90
    tags:
      - public
      - badges
      - badges-gitea
