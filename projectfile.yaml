identity:
  created: "2026-06-05"
  name: ignorelint
  summary: Linter for gitignore, dockerignore and other ignore files
  title: Ignorelint
  description: Ignorelint is a linter and auto-fixer for ignore files such as .gitignore, .dockerignore and .npmignore, written in Crystal. It recognises 25 filenames across eight format-specific glob drivers and reports 24 diagnostic rules with human, JSON, checkstyle and SARIF output.
