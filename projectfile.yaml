org:
  projectfile:
    ci:
      env:
        TARGET_ARCH: amd64
        TARGET_OS: linux
      forgejo:
        credentials:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      gha:
        credentials:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      nodes:
        binaries-built:
          matrix:
            axes:
              TARGET_ARCH:
                - amd64
              TARGET_OS:
                - linux
        binaries-released:
          matrix:
            axes:
              TARGET_ARCH:
                - amd64
              TARGET_OS:
                - linux
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    status: maintained
