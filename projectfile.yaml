$schema: https://projectfile.org/schema/v1.json
identity:
  created: "2026-06-05"
  name: ignorelint
  namespace: me.dbuho
  summary:
    en: Linter for gitignore, dockerignore and 20+ other ignore files
    es: Linter para .gitignore, .dockerignore y más de 20 archivos de ignorados
    uk: Лінтер для .gitignore, .dockerignore та понад 20 інших ignore-файлів
  title: Ignorelint
  description:
    en: Ignorelint is a linter and auto-fixer for ignore files such as .gitignore, .dockerignore and .npmignore, written in Crystal. It recognises 25 filenames across eight format-specific glob drivers and reports 25 diagnostic rules with human, JSON, checkstyle and SARIF output.
    es: Ignorelint es un linter y corrector automático para archivos de ignorados como .gitignore, .dockerignore y .npmignore, escrito en Crystal. Reconoce 25 nombres de archivo a través de ocho controladores de globs específicos de formato e informa 25 reglas de diagnóstico con salida humana, JSON, checkstyle y SARIF.
    uk: Ignorelint — лінтер і автокоректор для ignore-файлів як-от .gitignore, .dockerignore та .npmignore, написаний на Crystal. Розпізнає 25 назв файлів у восьми специфічних для форматів glob-драйверах і звітує 25 діагностичних правил з виводом для людини, JSON, checkstyle та SARIF.
  version: 1.4.0
  released: "2026-09-15"
includes:
  - .makefile/b19/ci.yaml
  - .makefile/b19/images/crystal.yaml
  - .makefile/b19/images/ubuntu.yaml
  - .makefile/b19/traits/signed-images.yaml
  - .makefile/b19/traits/attested-images.yaml
  - .makefile/container/traits/readme-tool-image.yaml
  - .makefile/library/languages/crystal.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/forge/codeberg.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/forge/github.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/registry/ghcr.yaml
keywords:
  - ignorelint
  - linter
  - gitignore
  - dockerignore
  - ignore-files
  - crystal
kind: SoftwareSourceCode
license:
  covers: project
  spdx: "MIT"
links:
  - label:
      en: Ignorelint on GitHub
      es: Ignorelint en GitHub
      uk: Ignorelint на GitHub
    priority: 80
    tags:
      - public
      - badges
      - badges-github
    type: source-code
    url: https://github.com/damian-buho/ignorelint
  - label:
      en: Issues on GitHub
